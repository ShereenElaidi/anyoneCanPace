name: CI

# Checks every pull request: types, tests and a production build (which also
# runs scripts/check-bundle.ts). Nothing is deployed from here; only pushes to
# main deploy (deploy.yml).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to verified release commits; the comment is the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails on high or critical advisories. Known moderate/low build-tool
      # findings are listed in the log and explained in the README.
      - name: Dependency audit
        run: npm audit --audit-level=high
